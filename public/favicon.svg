<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1226"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with subtle border -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Compass / Globe Lat/Long grid rings -->
  <circle cx="32" cy="33" r="21" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.25" stroke-dasharray="2 2"/>
  <ellipse cx="32" cy="33" rx="10" ry="21" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.2"/>

  <!-- Stylized "RS" Monogram in Gold -->
  <g filter="url(#glow)">
    <!-- Letter R -->
    <path d="M16 44V22h9c4 0 6.5 2 6.5 5.5s-2.5 5.5-6.5 5.5H21v11h-5zm5-16h4c1.8 0 2.8-.8 2.8-2s-1-2-2.8-2h-4v4zm5.5 16l4.5-9h4l-4.5 9h-4z" fill="url(#goldGrad)"/>
    <!-- Letter S -->
    <path d="M37.5 44c-3.2 0-5.5-1.5-6.2-4l4-1.2c.4 1.4 1.5 2.2 3.2 2.2 1.8 0 3-.8 3-2 0-1.2-.8-1.8-3.2-2.4l-1.8-.5c-3.2-.8-4.8-2.4-4.8-5 0-3.2 2.5-5.1 6-5.1 3 0 5 1.4 5.8 3.5l-3.8 1.4c-.4-1.2-1.3-1.8-2.6-1.8-1.5 0-2.4.7-2.4 1.8 0 1 .8 1.6 2.8 2.1l1.8.5c3.5.9 5.2 2.6 5.2 5.3 0 3.3-2.6 5.1-6.5 5.1z" fill="url(#goldGrad)"/>
  </g>

  <!-- Soaring Airplane Silhouette in Sky Blue -->
  <path d="M43 14l-3 4-7-2-2 2 6 4-3 5-3-1-1.5 1.5 3 2.5 2.5 3 1.5-1.5-1-3 5-3 4 6 2-2-2-7 4-3c1.5-1.2 1-3.2-.5-4.5s-3.3-2-4.5-.5z" fill="url(#blueGrad)"/>

  <!-- Flight trail arc -->
  <path d="M12 40C16 28 28 17 41 15" stroke="url(#blueGrad)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="1 3"/>
</svg>
